[project]
name = "am01-detection-of-anomalous-behaviour-in-industrial-robot"
version = "0.1.0"
description = "Anomaly detection for industrial robots using adversarial autoencoders"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Student Group", email = "alessio.mascolini@polito.it" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "torch>=2.7,<2.8",  # pinned to cu128 for driver-570 compat (no CUDA 13 / cu130 here)
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pyyaml>=6.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.uv]
package = true
python-preference = "managed"
