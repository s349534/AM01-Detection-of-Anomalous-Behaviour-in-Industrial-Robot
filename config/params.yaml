# Model parameters for Anomaly Detection
# Adversarial Autoencoder configuration

model:
  name: "adversarial_autoencoder"
  input_dim: 82            # 86 original columns - 4 constant features (sensor_id{2,5,6,7}_temp)
  window_size: 16          # timesteps per sliding window
  encoding_dim: 32         # intermediate dense layer dimension
  latent_dim: 16           # latent vector dimension

  encoder:
    # 1D-Conv architecture (see §4.1.2 in project_plan)
    conv_channels: [128, 64]   # output channels per Conv1d
    conv_kernels: [5, 3]       # kernel size per Conv1d
    pool_size: 2               # MaxPool after first conv
    activation: "relu"

  decoder:
    # Symmetric decoder: ConvTranspose1d for temporal upsampling
    conv_channels: [64, 128]   # channels (reverse order of encoder)
    activation: "relu"

  discriminator:
    hidden_layers: [32, 16]
    activation: "leaky_relu"

training:
  batch_size: 256
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  beta1: 0.5
  beta2: 0.999

  adversarial_weight: 0.1
  reconstruction_weight: 1.0

  early_stopping:
    patience: 10
    min_delta: 0.0001

  train_split: 0.6       # 60% of KukaNormal → training (semi-supervised: normal only)
  val_split: 0.2         # 20% of KukaNormal → validation + threshold calibration
  # test_split = 1.0 - train_split - val_split = 0.2 (20% KukaNormal → test_normal)

data:
  normal_data_path: "data/raw/KukaVelocityDataset/KukaNormal.npy"
  slow_data_path: "data/raw/KukaVelocityDataset/KukaSlow.npy"
  column_names_path: "data/raw/KukaVelocityDataset/KukaColumnNames.npy"

  # Sequence-aware: each sample = window of W consecutive timesteps
  window_size: 16          # number of timesteps per window (see §4.1.1)
  window_stride: 1         # sliding-window stride
  drop_incomplete: true    # drop first W-1 samples (insufficient history)

  normalization: "standard"   # StandardScaler fit on train only
  augmentation: false
  # No outlier clipping — by project design (see §7 #9 in project_plan).
  # Sensor saturation (Gyro ±2000, Acc ±16) is handled by StandardScaler + MSE loss.