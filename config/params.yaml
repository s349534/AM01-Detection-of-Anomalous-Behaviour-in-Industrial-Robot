model:
  name: adversarial_autoencoder
  input_dim: 109
  window_size: 16
  encoding_dim: 32
  latent_dim: 16
  encoder:
    conv_channels:
    - 64
    - 32
    - 16
    conv_kernels:
    - 5
    - 3
    - 3
    pool_size: 2
    activation: relu
  discriminator:
    hidden_layers:
    - 32
    - 16
    activation: leaky_relu
training:
  batch_size: 256
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  beta1: 0.5
  beta2: 0.999
  num_workers: 4
  adversarial_weight: 0.1
  reconstruction_weight: 1.0
  loss: mae
  reconstruction_metric: mae
  early_stopping:
    patience: 10
    min_delta: 0.0001
  train_split: 0.7
  val_split: 0.15
  slow_val_split: 0.5
data:
  normal_data_path: data/raw/KukaNormal.npy
  slow_data_path: data/raw/KukaSlow.npy
  column_names_path: data/raw/KukaColumnNames.npy
  window_size: 16
  window_stride: 1
  drop_incomplete: true
  normalization: standard
  augmentation: false
