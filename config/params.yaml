# Model parameters for Anomaly Detection
# Adversarial Autoencoder configuration

model:
  name: "adversarial_autoencoder"
  input_dim: 82            # 86 original columns - 4 constant features (sensor_id{2,5,6,7}_temp)
  window_size: 16          # timesteps per sliding window (must be multiple of 4)
  encoding_dim: 32         # intermediate dense layer dimension (unused in conv AE)
  latent_dim: 16           # latent vector dimension

  encoder:
    # 1D-Conv architecture (see §4.1.2 in project_plan)
    conv_channels: [64, 32, 16]   # output channels per Conv1d (3 layers, funnel)
    conv_kernels: [5, 3, 3]       # kernel size per Conv1d
    pool_size: 2               # MaxPool after first and second conv
    activation: "relu"

  # decoder is auto-derived from encoder conv_channels (reversed)
  # no separate decoder configuration needed

  discriminator:
    hidden_layers: [32, 16]
    activation: "leaky_relu"

training:
  batch_size: 256
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  beta1: 0.5
  beta2: 0.999
  num_workers: 4  # DataLoader workers for parallel data loading

  adversarial_weight: 0.1
  reconstruction_weight: 1.0
  loss: "mae"                    # "mae" | "mse" — loss di ricostruzione (MAE robusta a feature saturo, vedi §7 #9)
  reconstruction_metric: "mae"   # "mae" | "mse" — metrica per anomaly scoring (deve match loss)

  early_stopping:
    patience: 10
    min_delta: 0.0001

  train_split: 0.70       # 70% of KukaNormal → training (semi-supervised: normal only)
  val_split: 0.15         # 15% of KukaNormal → validation (early stopping + threshold + HP selection)
  # test_normal = 1.0 - train_split - val_split = 0.15 (15% KukaNormal → test_normal)
  slow_val_split: 0.50    # 50% of KukaSlow → validation anomaly (HP selection)
  # slow_test_split = 1.0 - slow_val_split = 0.50 (50% KukaSlow → test_anomaly)

data:
  normal_data_path: "data/raw/KukaNormal.npy"
  slow_data_path: "data/raw/KukaSlow.npy"
  column_names_path: "data/raw/KukaColumnNames.npy"

  # Sequence-aware: each sample = window of W consecutive timesteps
  window_size: 16          # number of timesteps per window (see §4.1.1)
  window_stride: 1         # sliding-window stride
  drop_incomplete: true    # drop first W-1 samples (insufficient history)

  normalization: "standard"   # StandardScaler fit on train only
  augmentation: false
  # No outlier clipping — by project design (see §7 #9 in project_plan).
  # Sensor saturation (Gyro ±2000, Acc ±16) is handled by StandardScaler + MAE loss
  # (robust to outlier scale; MSE would square large residuals).