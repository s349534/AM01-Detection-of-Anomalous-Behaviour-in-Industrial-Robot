# Model parameters for Anomaly Detection
# Adversarial Autoencoder configuration

model:
  name: "adversarial_autoencoder"
  input_dim: 86            # numero di sensori (colonne)
  window_size: 16          # timestep per finestra (sequence-aware)
  encoding_dim: 32         # dim dello strato denso intermedio
  latent_dim: 16           # dim del vettore latente z

  encoder:
    # Architettura 1D-Conv (vedi §4.1.2 del project_plan)
    conv_channels: [128, 64]   # canali in uscita da ogni Conv1d
    conv_kernels: [5, 3]       # kernel size di ogni Conv1d
    pool_size: 2               # MaxPool dopo la prima conv
    activation: "relu"

  decoder:
    # Decoder speculare: ConvTranspose1d per upsampling temporale
    conv_channels: [64, 128]   # canali (ordine inverso rispetto encoder)
    activation: "relu"

  discriminator:
    hidden_layers: [32, 16]
    activation: "leaky_relu"

training:
  batch_size: 256
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  beta1: 0.5
  beta2: 0.999

  adversarial_weight: 0.1
  reconstruction_weight: 1.0

  early_stopping:
    patience: 10
    min_delta: 0.0001

  train_split: 0.8
  val_split: 0.1

data:
  normal_data_path: "data/raw/KukaVelocityDataset/KukaNormal.npy"
  slow_data_path: "data/raw/KukaVelocityDataset/KukaSlow.npy"
  column_names_path: "data/raw/KukaVelocityDataset/KukaColumnNames.npy"

  # Sequence-aware: ogni sample = finestra di W timestep consecutivi
  window_size: 16          # numero di timestep per finestra (vedi §4.1.1)
  window_stride: 1         # passo della finestra scorrevole
  drop_incomplete: true    # scarta i primi W-1 sample se non hanno storia

  normalization: "standard"
  augmentation: false

metrics:
  - "accuracy"
  - "precision"
  - "recall"
  - "f1_score"
  - "auc_roc"

paths:
  processed_data_dir: "data/processed/"
  models_dir: "src/models/"
  results_dir: "reports/"
  figures_dir: "reports/figures/"
  tables_dir: "reports/tables/"