# Main configuration file for AM01 project
# Project: Anomaly Detection in Industrial Robots

project:
  name: "AM01-AnomalyDetection"
  version: "0.1.0"
  description: "Detection of Anomalous Behaviour in Industrial Robot using Adversarial Autoencoders"
  author: "Student Group"
  course: "Machine Learning in Applications"
  university: "Politecnico di Torino"

environment:
  python_version: ">=3.10"
  framework: "pytorch"
  device: "cuda"  # Use "cpu" for CPU-only

paths:
  data_raw: "data/raw/"
  data_processed: "data/processed/"
  models: "src/models/"
  reports: "reports/"
  notebooks: "notebooks/"

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Data paths are configured in params.yaml