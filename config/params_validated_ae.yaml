project:
  name: AM01-AnomalyDetection
  version: 0.1.0
  description: Detection of Anomalous Behaviour in Industrial Robot using Adversarial
    Autoencoders
  author: Student Group
  course: Machine Learning in Applications
  university: Politecnico di Torino
environment:
  python_version: '>=3.10'
  framework: pytorch
  device: cuda
paths:
  data_raw: data/raw/
  data_processed: data/processed/
  models: src/models/
  reports: reports/
  notebooks: notebooks/
logging:
  level: INFO
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
model:
  name: adversarial_autoencoder
  input_dim: 82
  window_size: 16
  encoding_dim: 32
  latent_dim: 8
  encoder:
    conv_channels:
    - 64
    - 32
    - 16
    conv_kernels:
    - 5
    - 3
    - 3
    pool_size: 2
    activation: relu
  discriminator:
    hidden_layers:
    - 32
    - 16
    activation: leaky_relu
  threshold: 0.137498
training:
  batch_size: 256
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  beta1: 0.5
  beta2: 0.999
  num_workers: 4
  adversarial_weight: 0.1
  reconstruction_weight: 1.0
  loss: mae
  reconstruction_metric: mae
  early_stopping:
    patience: 10
    min_delta: 0.0001
  train_split: 0.7
  val_split: 0.15
  slow_val_split: 0.5
data:
  normal_data_path: data/raw/KukaNormal.npy
  slow_data_path: data/raw/KukaSlow.npy
  column_names_path: data/raw/KukaColumnNames.npy
  window_size: 16
  window_stride: 1
  drop_incomplete: true
  normalization: standard
  augmentation: false
validation:
  threshold_run_id: 1
  threshold_calibrated_at: '2026-10-02T14:47:10.100344+00:00'
  val_roc_auc: 0.316332
  val_pr_auc: 0.269922
  source_csv: reports\tables\validation_results_ae.csv
