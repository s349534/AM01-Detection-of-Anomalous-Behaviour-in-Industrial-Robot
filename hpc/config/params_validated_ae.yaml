project:
  name: AM01-AnomalyDetection
  version: 0.1.0
  description: Detection of Anomalous Behaviour in Industrial Robot using Adversarial
    Autoencoders
  author: Student Group
  course: Machine Learning in Applications
  university: Politecnico di Torino
environment:
  python_version: '>=3.10'
  framework: pytorch
  device: cuda
paths:
  data_raw: data/raw/
  data_processed: data/processed/
  models: src/models/
  reports: reports/
  notebooks: notebooks/
logging:
  level: INFO
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
model:
  name: adversarial_autoencoder
  input_dim: 82
  window_size: 32
  encoding_dim: 32
  latent_dim: 16
  encoder:
    conv_channels:
    - 128
    - 64
    conv_kernels:
    - 5
    - 3
    pool_size: 2
    activation: relu
  decoder:
    conv_channels:
    - 64
    - 128
    activation: relu
  discriminator:
    hidden_layers:
    - 32
    - 16
    activation: leaky_relu
training:
  batch_size: 256
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  beta1: 0.5
  beta2: 0.999
  adversarial_weight: 0.1
  reconstruction_weight: 1.0
  early_stopping:
    patience: 10
    min_delta: 0.0001
  train_split: 0.6
  val_split: 0.2
data:
  normal_data_path: data/raw/KukaVelocityDataset/KukaNormal.npy
  slow_data_path: data/raw/KukaVelocityDataset/KukaSlow.npy
  column_names_path: data/raw/KukaVelocityDataset/KukaColumnNames.npy
  window_size: 16
  window_stride: 1
  drop_incomplete: true
  normalization: standard
  augmentation: false
